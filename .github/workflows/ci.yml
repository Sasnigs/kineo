name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo build and test
    runs-on: macos-15
    timeout-minutes: 25

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project boundaries
        working-directory: ${{ github.workspace }}
        run: Scripts/verify-project-boundaries.sh

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint
          npm run test:ci

      - name: Verify Expo dependencies
        run: |
          npm run dependencies:check
          npm run audit

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/kineo-expo-export"

      - name: Generate and build native iOS app
        run: |
          npx expo prebuild --platform ios --clean
          xcodebuild \
            -workspace ios/Kineo.xcworkspace \
            -scheme Kineo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/kineo-expo-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
