name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo build and test
    # Expo 57's ExpoModulesJSI package requires Swift 6.2 or newer.
    runs-on: macos-26
    # A clean Expo Release build takes about 20 minutes on the hosted runner;
    # retain enough time for accessibility launch and common-task UI checks.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project boundaries
        working-directory: ${{ github.workspace }}
        run: Scripts/verify-project-boundaries.sh

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint
          npm run test:ci

      - name: Verify Expo dependencies
        run: |
          npm run dependencies:check
          npm run audit

      - name: Verify native storage path policy
        run: |
          swiftc \
            -module-cache-path "$RUNNER_TEMP/kineo-swift-module-cache" \
            modules/kineo-storage-protection/ios/KineoStoragePathPolicy.swift \
            ../../Scripts/KineoStoragePathPolicyTests.swift \
            -o "$RUNNER_TEMP/kineo-storage-path-policy-tests"
          "$RUNNER_TEMP/kineo-storage-path-policy-tests"

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/kineo-expo-export"

      - name: Boot required iOS simulators
        working-directory: ${{ github.workspace }}
        run: |
          smallest_id="$(Scripts/prepare-ios-simulator.sh \
            'Kineo iPhone SE (3rd generation)' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation')"
          reference_id="$(Scripts/prepare-ios-simulator.sh \
            'Kineo iPhone 16 Pro' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro')"
          printf 'KINEO_SMALLEST_SIMULATOR_ID=%s\n' "$smallest_id" >> "$GITHUB_ENV"
          printf 'KINEO_REFERENCE_SIMULATOR_ID=%s\n' "$reference_id" >> "$GITHUB_ENV"

      - name: Generate and build native iOS app
        run: |
          npx expo prebuild --platform ios --clean
          xcodebuild \
            -workspace ios/Kineo.xcworkspace \
            -scheme Kineo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$KINEO_REFERENCE_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/kineo-expo-derived-data" \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Verify clean Expo launch
        working-directory: ${{ github.workspace }}
        run: |
          Scripts/verify-simulator-launch.sh \
            "$KINEO_REFERENCE_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "Get started"
          xcrun simctl ui "$KINEO_SMALLEST_SIMULATOR_ID" \
            content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$KINEO_SMALLEST_SIMULATOR_ID" appearance dark
          Scripts/verify-simulator-launch.sh \
            "$KINEO_SMALLEST_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "routine shaped"

      - name: Verify Expo common tasks
        working-directory: ${{ github.workspace }}
        run: |
          maestro_bin="$(Scripts/install-maestro.sh "$RUNNER_TEMP/kineo-tools")"
          Scripts/run-maestro-ios.sh \
            "$KINEO_SMALLEST_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "$maestro_bin"
          Scripts/run-maestro-ios.sh \
            "$KINEO_REFERENCE_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "$maestro_bin"
