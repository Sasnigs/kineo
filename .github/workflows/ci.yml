name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo build and test
    # Expo 57's ExpoModulesJSI package requires Swift 6.2 or newer.
    runs-on: macos-26
    timeout-minutes: 25

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project boundaries
        working-directory: ${{ github.workspace }}
        run: Scripts/verify-project-boundaries.sh

      - name: Verify source
        run: |
          npm run typecheck
          npm run lint
          npm run test:ci

      - name: Verify Expo dependencies
        run: |
          npm run dependencies:check
          npm run audit

      - name: Verify native storage path policy
        run: |
          swiftc \
            -module-cache-path "$RUNNER_TEMP/kineo-swift-module-cache" \
            modules/kineo-storage-protection/ios/KineoStoragePathPolicy.swift \
            ../../Scripts/KineoStoragePathPolicyTests.swift \
            -o "$RUNNER_TEMP/kineo-storage-path-policy-tests"
          "$RUNNER_TEMP/kineo-storage-path-policy-tests"

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/kineo-expo-export"

      - name: Boot iOS simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            printf 'No available iPhone simulator was found.\n' >&2
            exit 1
          fi
          simulator_state="$(xcrun simctl list devices -j | \
            jq -r --arg simulator_id "$simulator_id" \
              '.devices[][] | select(.udid == $simulator_id) | .state')"
          if [[ "$simulator_state" != "Booted" ]]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          printf 'KINEO_SIMULATOR_ID=%s\n' "$simulator_id" >> "$GITHUB_ENV"

      - name: Generate and build native iOS app
        run: |
          npx expo prebuild --platform ios --clean
          xcodebuild \
            -workspace ios/Kineo.xcworkspace \
            -scheme Kineo \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$KINEO_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/kineo-expo-derived-data" \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Verify clean Expo launch
        working-directory: ${{ github.workspace }}
        run: |
          Scripts/verify-simulator-launch.sh \
            "$KINEO_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "Get started"
          xcrun simctl ui "$KINEO_SIMULATOR_ID" \
            content_size accessibility-extra-extra-extra-large
          xcrun simctl ui "$KINEO_SIMULATOR_ID" appearance dark
          Scripts/verify-simulator-launch.sh \
            "$KINEO_SIMULATOR_ID" \
            "$RUNNER_TEMP/kineo-expo-derived-data/Build/Products/Release-iphonesimulator/Kineo.app" \
            "routine shaped"
