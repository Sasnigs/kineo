appId: app.kineo.expo.prototype
name: Routine interruption, alternative, and safety stop
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Make room for how you feel today."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow: subflows/onboard-single-area.yaml
- tapOn: "Check in"
- tapOn: "Similar"
- tapOn: "Continue"
- tapOn: "Okay"
- tapOn: "Continue"
- tapOn: "Review your plan"
- tapOn: "Quick · 5 min"
- tapOn: "Begin routine"
- assertVisible: "Neck mobility"
- scrollUntilVisible:
    element: "Pause"
    direction: DOWN
- tapOn: "Pause"
- assertVisible: "Your place is saved."
- launchApp
- extendedWaitUntil:
    visible: "Come back at your pace."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- tapOn: "Resume routine"
- assertVisible: "Your place is saved."
- tapOn: "Resume routine"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Alternative"
- assertVisible: "Seated chin nod"
- tapOn: "Use this alternative"
- assertVisible: "Seated chin nod"
- scrollUntilVisible:
    element: "Something feels wrong"
    direction: DOWN
- tapOn: "Something feels wrong"
- assertVisible: "Listen to that feeling."
- tapOn: "I tapped this by mistake"
- assertVisible: "Your place is saved."
- tapOn: "Resume routine"
- scrollUntilVisible:
    element: "Something feels wrong"
    direction: DOWN
- tapOn: "Something feels wrong"
- tapOn: "End routine"
- assertVisible: "You chose to stop."
- tapOn: "Done"
- assertVisible: "You made space for yourself."
