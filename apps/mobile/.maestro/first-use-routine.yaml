appId: app.kineo.expo.prototype
name: First use through routine feedback and deletion
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "A routine shaped around how you feel now."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow: subflows/onboard-single-area.yaml
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Check in"
- assertVisible: "Compared with your usual pattern…"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Similar"
- assertVisible: "How does movement feel?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Okay"
- assertVisible: "Your plan for today"
- runFlow:
    file: subflows/scroll-to-element.yaml
    env:
      ELEMENT_LABEL: "Balanced"
- assertVisible: "Balanced"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Quick"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Begin routine"
- runFlow:
    file: subflows/skip-current-movement.yaml
    env:
      EXPECTED_MOVEMENT: "Prototype movement 1"
- runFlow:
    file: subflows/skip-current-movement.yaml
    env:
      EXPECTED_MOVEMENT: "Prototype movement 4"
- assertVisible: "Prototype movement 2"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "More options"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Skip this step"
- assertVisible: "How did neck feel afterward?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "About the same"
- assertVisible: "You made a choice for today."
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Done"
- assertVisible: "How are you moving?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Progress"
- assertVisible: "Progress without pressure"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Profile"
- assertVisible: "Profile"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Delete All Data"
- assertVisible: "Delete all Kineo data?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Delete all data"
- extendedWaitUntil:
    visible: "A routine shaped around how you feel now."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
