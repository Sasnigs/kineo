appId: app.kineo.expo.prototype
name: First use through routine feedback and deletion
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Make room for how you feel today."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow: subflows/onboard-single-area.yaml
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Check in"
- assertVisible: "Compared with your usual pattern…"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Similar"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue"
- assertVisible: "How does movement feel?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Okay"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue"
- tapOn: "Review your plan"
- assertVisible: "A steady starting point."
- runFlow:
    file: subflows/scroll-to-element.yaml
    env:
      ELEMENT_LABEL: "Balanced"
- assertVisible: "Balanced"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Quick · 5 min"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Begin routine"
- runFlow:
    file: subflows/skip-current-movement.yaml
    env:
      EXPECTED_MOVEMENT: "Neck mobility"
- runFlow:
    file: subflows/skip-current-movement.yaml
    env:
      EXPECTED_MOVEMENT: "Neck mobility"
- assertVisible: "Neck mobility"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Skip"
- assertVisible: "Move past this step?"
- tapOn: "Skip this step"
- assertVisible: "How did your neck feel afterward?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "About the same"
- tapOn: "Save response"
- assertVisible: "A little time. Well considered."
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Done"
- assertVisible: "You made space for yourself."
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "History"
- assertVisible: "History"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "You"
- assertVisible: "Make it work for you."
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Privacy & your data"
- tapOn: "Delete all data"
- assertVisible: "Delete your account and data?"
- runFlow:
    file: subflows/tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Delete all data"
- runFlow:
    when:
      visible: "Back to welcome"
    commands:
      - tapOn: "Back to welcome"
- extendedWaitUntil:
    visible: "Make room for how you feel today."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
