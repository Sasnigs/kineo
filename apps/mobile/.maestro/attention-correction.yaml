appId: app.kineo.expo.prototype
name: Attention gate survives relaunch and clears through correction
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Make room for how you feel today."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow: subflows/onboard-single-area.yaml
- tapOn: "Check in"
- tapOn: "Worse"
- tapOn: "Continue"
- tapOn: "Limited"
- tapOn: "Continue"
- assertVisible: "Is this a new or unusual change?"
- tapOn: "Yes, or I’m not sure"
- tapOn: "Continue"
- assertVisible: "No routine right now."
- launchApp
- extendedWaitUntil:
    visible: "Has your neck returned to its usual pattern?"
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- assertVisible: "Has your neck returned to its usual pattern?"
- tapOn: "I selected that by mistake"
- assertVisible: "Compared with your usual pattern…"
- tapOn: "Similar"
- tapOn: "Continue"
- tapOn: "Okay"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Start with how you feel."
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- assertVisible: "Check in"
