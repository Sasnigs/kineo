appId: app.kineo.expo.prototype
---
- assertVisible: ${EXPECTED_MOVEMENT}
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Skip"
- assertVisible: "Move past this step?"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Skip this step"
- assertVisible: "Between movements"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue to movement"
