appId: app.kineo.expo.prototype
---
- assertVisible: "A routine shaped around how you feel now."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Get started"
- assertVisible: "Are you 18 or older?"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Yes, I’m 18 or older"
- assertVisible: "Keep your progress with you"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue with test account"
- assertVisible: "Review before continuing"
- tapOn: "I accept the Terms of Service and Privacy Policy for this internal prototype."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Accept and continue"
- assertVisible: "Where would you like to start?"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Neck"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue"
- extendedWaitUntil:
    visible: "Anything else to include?"
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Just focus on my main area"
- assertVisible: "You stay in control."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "I understand"
- assertVisible: "Let’s make this useful."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue to Today"
- assertVisible: "How are you moving?"
