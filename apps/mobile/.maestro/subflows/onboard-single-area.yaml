appId: app.kineo.expo.prototype
---
- assertVisible: "Make room for how you feel today."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Find your starting point"
- assertVisible: "Are you 18 or older?"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Yes, I’m 18 or older"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue"
- assertVisible: "Keep your history with you."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue with Apple"
- assertVisible: "Where would you like to focus?"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Neck"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Continue"
- extendedWaitUntil:
    visible: "One more area?"
    timeout: ${UI_WAIT_TIMEOUT_MILLISECONDS}
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Just neck for now"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Set my intention"
- assertVisible: "You stay in control"
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "I understand"
- assertVisible: "A small loop. Built around you."
- runFlow:
    file: tap-visible-control.yaml
    env:
      CONTROL_LABEL: "Go to Today"
- assertVisible: "Start with how you feel."
